[package]
name = "mlx-lm"
version = "0.0.1"
edition.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
documentation.workspace = true
description = "Rust implementation of mlx-lm"

# Per-family model features. Additive and ON by default, so existing consumers are unaffected;
# a consumer that only loads some families builds lean with `default-features = false`.
# The qwen3/qwen3_5/qwen3_5_vision/gated_delta CORE is always compiled — see src/models/mod.rs
# for why it cannot be split (qwen3 <-> qwen3_5 are mutually referential; features must be a DAG).
[features]
default = ["all-models"]
all-models = [
    "deepseek-v2",
    "gemma3",
    "glm4",
    "glm4-moe-lite",
    "gpt-oss",
    "llama",
    "qwen2",
    "qwen3-moe",
    "qwen3-5-moe",
]
deepseek-v2 = []
gemma3 = []
glm4 = []
glm4-moe-lite = []
gpt-oss = []
llama = []
qwen2 = []
qwen3-moe = []
# qwen3_5_moe reuses qwen3_moe's blocks, so it pulls that family in.
qwen3-5-moe = ["qwen3-moe"]

[dependencies]
# Local dependencies
mlx-rs.workspace = true
mlx-macros.workspace = true
mlx-lm-utils.workspace = true

# External dependencies
serde = { version = "1", features = ["derive"] }
anyhow = "1"
tokenizers = { version = "0.22.0", features = ["http"] } 
clap = { version = "4", features = ["derive"] }
idna_adapter = "1.2" 
thiserror = "2"
serde_json = "1"
minijinja = "2"

[dev-dependencies]
lazy_static = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }